# Environment-independent security headers, shared by local Docker and AWS.
#
# Include this file in the server block AND in every `location` that uses
# add_header: nginx does NOT inherit add_header from the parent level once a
# location defines its own add_header (e.g. Cache-Control), so without the
# include those headers silently disappear from the response.
#
# Not set here on purpose:
#  - Content-Security-Policy: its connect-src depends on the environment
#    (local: http://localhost:3000 + the gateway; AWS: same origin + the
#    gateway). In AWS it is set by CloudFront, see infra/security_headers.tf.
#  - Strict-Transport-Security: only meaningful over HTTPS, which terminates
#    at CloudFront.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;