server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (OWASP baseline) — see https://observatory.mozilla.org/
  # They live in a shared snippet that must be included again inside every
  # location below: a location with its own add_header drops the ones
  # inherited from this level. CSP and HSTS are handled by CloudFront in AWS
  # (see the comments in security-headers.conf).
  include /etc/nginx/snippets/security-headers.conf;

  # Static assets are content-hashed by Vite, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # This is what makes a browser refresh on /checkout, /summary or /result
  # work: without it, the web server looks for a literal file at that path,
  # doesn't find one (this is a client-side React Router route, not a real
  # file), and returns 404 — which looks exactly like "the app lost my
  # progress" even though the persisted Redux state in localStorage is fine.
  # Falling back to index.html lets the SPA boot, read the router URL itself,
  # rehydrate state from localStorage, and land back on the right step.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
}